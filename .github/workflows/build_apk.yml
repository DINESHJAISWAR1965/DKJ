name: Build Bcube Invest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Project ka folder structure banao (seedhi files se)
        run: |
          set -e
          mkdir -p app/src/main/java/com/bcube/invest app/src/main/assets app/src/main/res/drawable
          place() { # file  destination
            if [ -f "$1" ]; then cp "$1" "$2"; echo "OK  $1 -> $2"; fi
          }
          place app_build.gradle        app/build.gradle
          place AndroidManifest.xml     app/src/main/AndroidManifest.xml
          place MainActivity.java       app/src/main/java/com/bcube/invest/MainActivity.java
          place index.html              app/src/main/assets/index.html
          place ic_launcher.xml         app/src/main/res/drawable/ic_launcher.xml
          place bcube.jks               app/bcube.jks
          # zaroori files check
          for f in build.gradle settings.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/bcube/invest/MainActivity.java app/src/main/assets/index.html app/src/main/res/drawable/ic_launcher.xml app/bcube.jks; do
            [ -f "$f" ] || { echo "FILE NAHI MILI: $f  (is naam se repo me upload kijiye)"; exit 1; }
          done

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK banao
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK upload
        uses: actions/upload-artifact@v4
        with:
          name: BcubeInvest-APK
          path: app/build/outputs/apk/release/*.apk
