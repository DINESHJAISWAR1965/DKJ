addEventListener('load',function(){setTimeout(function(){var a=atob(document.getElementById('d').textContent.trim()),n=a.length-4,s=0,i;for(i=0;i<4;i++)s=(s<<8|a.charCodeAt(i))>>>0;
function r(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)}
var u=new Uint8Array(n);for(i=0;i<n;i++)u[i]=a.charCodeAt(i+4)^(r()>>>24);
var h=new TextDecoder().decode(u);document.open();document.write(h);document.close()},0)});
<\/script></body></html>`;
async function lock(html){const b=new TextEncoder().encode(html),sd=crypto.getRandomValues(new Uint8Array(4)),all=new Uint8Array(4+b.length);all.set(sd);
 let s=0;for(let i=0;i<4;i++)s=(s<<8|sd[i])>>>0;
 const r=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)};
 for(let i=0;i<b.length;i++)all[4+i]=b[i]^(r()>>>24);
 let bin='';for(let i=0;i<all.length;i+=0x8000)bin+=String.fromCharCode.apply(null,all.subarray(i,i+0x8000));
 return LOADER.replace('__B64__',()=>btoa(bin))}
const tmx=t=>new Date(t*1000).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
async function buildExport(){
 /* saved copy = live page ki poori copy + data, naya 'edition' design; Refresh/Save/Skin/Auto band; tab/site/search wahi jo screen par hai */
 const c=document.documentElement.cloneNode(true);
 ['grid','chips','cats'].forEach(i=>{c.querySelector('#'+i).innerHTML=''});c.querySelector('#info').textContent='';
 const sk=document.documentElement.dataset.skin||'sun';   /* jo style screen par chuni hai wahi save hogi */
 c.querySelector('.tools').insertAdjacentHTML('afterbegin','<span class="stamp">Saved copy &middot; '+esc(tmx(D.fetched))+'</span>');
 c.querySelectorAll('#rf,#sv,#auto,#ai').forEach(e=>{e.disabled=true});
 c.querySelector('style').textContent+='#rf,#sv,#skins,#auto,#ai,.tools label{display:none!important}';
 let h='<!DOCTYPE html>'+c.outerHTML;
 const sub=(re,fn)=>{if(!re.test(h))throw new Error('Save: page ka code badla hua hai');h=h.replace(re,fn)};
 const js=v=>JSON.stringify(v).replace(/</g,'\\u003c').replace(/\u2028|\u2029/g,'');
 sub(/setSkin\(ls\('skin'\)\|\|'sun'\);/,()=>"setSkin("+js(sk)+");");
 sub(/if\(D\)render\(\);else refresh\(\);/,()=>"document.getElementById('q').value="+js(document.getElementById('q').value)+";render();");
 sub(/let D=null,sel=null,cat='all',SAVED=false,/,()=>'let D='+js(D)+',sel='+js(sel)+',cat='+js(cat)+',SAVED=true,');
 const x='<script>document.addEventListener("contextmenu",function(e){e.preventDefault()});document.addEventListener("keydown",function(e){var k=(e.key||"").toLowerCase();if(k==="f12"||(e.ctrlKey&&(k==="u"||k==="s"))||(e.ctrlKey&&e.shiftKey&&(k==="i"||k==="j"||k==="c")))e.preventDefault()})<\/script>',i=h.lastIndexOf('</body>');
 return lock(h.slice(0,i)+x+h.slice(i))}
const stampName=()=>new Date(Date.now()+19800000).toISOString().replace(/[-:T]/g,'').slice(0,14);
async function pcSave(n){const r=await fetch(API+'/api/save?name='+encodeURIComponent(n),{method:'POST',body:await buildExport()});return(await r.json()).path}
async function refresh(){if(SAVED)return;const b=document.getElementById('rf');b.disabled=true;b.textContent='Loading...';
 try{D=MOB?await collectJS():await(await fetch(API+'/api/news')).json();render();if(!MOB)pcSave('LATEST.html').catch(()=>{})}
 catch(e){alert(MOB?'Error: '+e.message:'Server chalu nahi hai. RUN_NEWS.bat chalaiye.')}
 b.disabled=false;b.innerHTML='&#8635; Refresh'}
document.getElementById('rf').onclick=refresh;
document.getElementById('sv').onclick=async()=>{if(!D)return;try{const n='BcubeInvest_'+stampName()+'.html';if(MOB){Android.save(n,await buildExport())}else{alert('Saved:\n'+await pcSave(n))}}catch(e){alert('Save error: '+e.message)}};
let tm;const ai=document.getElementById('ai');ai.value=ls('ai')||'5';
function setAuto(){clearInterval(tm);ls('ai',ai.value);if(document.getElementById('auto').checked)tm=setInterval(refresh,+ai.value*60000)}
document.getElementById('auto').onchange=setAuto;ai.onchange=setAuto;
setInterval(()=>D&&render(),60000);
if(D)render();else refresh();
</script></body></html>
