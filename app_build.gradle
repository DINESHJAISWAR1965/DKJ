plugins { id 'com.android.application' }

android {
    namespace 'com.bcube.invest'
    compileSdk 34
    defaultConfig {
        applicationId 'com.bcube.invest'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('bcube.jks')
            storePassword 'bcube123'
            keyAlias 'bcube'
            keyPassword 'bcube123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
